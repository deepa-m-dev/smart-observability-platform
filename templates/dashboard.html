<!DOCTYPE html>
<html lang="en">

<head>
    
<link rel="stylesheet" href="/static/style.css">

    
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Smart Observability Dashboard
</title>


</head>

<body>
<div class="dashboard">
<div class="container">

<h1>
Smart Observability Dashboard
</h1>

<div class="cards">

<div class="card">
<h2 id="totalLogs">0</h2>
<p>Total Logs</p>
</div>

<div class="card">
<h2 id="successRate">0%</h2>
<p>Success Rate</p>
</div>

<div class="card">
<h2 id="failureRate">0%</h2>
<p>Failure Rate</p>
</div>

<div class="card">
<h2 id="health">Healthy</h2>
<p>System Health</p>
</div>

</div>

<!-- INSIGHTS SECTION -->

<div
id="insightsContainer"

style="
margin-top:30px;
background:#1e293b;
padding:20px;
border-radius:10px;
"
>

<h2>
AI Insights
</h2>

<div id="insights"></div>

</div>

<form id="logForm">

<input
type="text"
id="api_name"
placeholder="API Name"
required
>

<select id="status">

<option value="success">
success
</option>

<option value="failure">
failure
</option>

</select>

<select id="severity">

<option value="INFO">
INFO
</option>

<option value="WARNING">
WARNING
</option>

<option value="ERROR">
ERROR
</option>

<option value="CRITICAL">
CRITICAL
</option>

</select>

<input
type="number"
id="response_time"
placeholder="Response Time"
required
>

<button type="submit">
Insert Log
</button>

</form>

<br>

<button onclick="simulateTraffic()">
Generate Fake Traffic
</button>

<div style="margin-top:20px;">

<button onclick="startSim()">Start Simulation</button>

<button onclick="stopSim()">Stop Simulation</button>

</div>

    
<a href="/export/csv">
<button>
Download CSV Report
</button>
</a>

<div class="charts">

<img
id="pieChart"
src="/static/charts/pie.png"
>

<img
id="barChart"
src="/static/charts/bar.png"
>

<img
id="lineChart"
src="/static/charts/line.png"
>

</div>

<table>

<thead>

<tr>
<th>API</th>
<th>Status</th>
<th>Severity</th>
<th>Response Time</th>
<th>Timestamp</th>
</tr>

</thead>

<tbody id="logsTable"></tbody>

</table>

</div>

</div>
    <script src="/static/script.js"></script>
</body>
</html>
